name: CI

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  verify:
    name: Python and Docker checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile crawler.py tests/test_crawler_db.py

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build Docker image
        run: docker build -t aim-crawler-ci:${{ github.sha }} .
